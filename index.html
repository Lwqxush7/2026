<style>
:root{
  --bg: #0b1424;
  --parchment: #eef3fa;
  --gold: #5eb8ff;
  --ember: #3f8ed9;
  --rest: #7c6ce6;
  --muted: #9db0c8;
  --glass: rgba(255,255,255,0.09);
  --glass-strong: rgba(18,32,54,0.62);
  --glass-line: rgba(255,255,255,0.20);
  --panel-line: rgba(255,255,255,0.16);
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.28);
  --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;}
html{ background: var(--bg); }
body{
  margin:0;
  min-height:100vh;
  background: transparent;
  color: var(--parchment);
  font-family: 'Georgia', 'Iowan Old Style', serif;
  padding: calc(28px + env(safe-area-inset-top, 0px)) 20px calc(40px + env(safe-area-inset-bottom, 0px));
}
/* Cam efektinin görünmesi için renkli, sabit arka plan */
body::before{
  content:'';
  position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(55% 45% at 12% 8%, rgba(63,142,217,0.60), transparent 70%),
    radial-gradient(50% 42% at 92% 18%, rgba(112,92,220,0.42), transparent 70%),
    radial-gradient(60% 50% at 75% 96%, rgba(40,170,200,0.38), transparent 70%),
    radial-gradient(45% 40% at 5% 80%, rgba(70,110,230,0.30), transparent 70%),
    #0b1424;
}
.wrap{ max-width: 980px; margin: 0 auto; }
header{ margin-bottom: 20px; }
h1{
  font-size: 34px;
  letter-spacing: 0.5px;
  margin: 0 0 18px;
  font-weight: 400;
  color: var(--parchment);
}

/* ---- Cam panel (ortak) ---- */
.glass{
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid var(--glass-line);
  box-shadow: var(--glass-shadow);
}

/* ---- Üst sıra: 5 istatistik + 4 buton ---- */
.topbar{
  display:grid;
  grid-template-columns: repeat(5, minmax(0,1fr)) repeat(4, 60px);
  grid-auto-rows: 64px;
  gap: 12px;
  align-items: stretch;
  font-family: var(--sans);
}
.stat{
  border-radius: 20px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap: 5px;
  padding: 0 8px;
  min-width: 0;
}
.stat .num{ font-family: Georgia, serif; font-size: 26px; color: var(--gold); line-height:1; }
.stat.rest-stat .num{ color: #b3a8ff; }
.stat .lbl{
  font-size: 10.5px; color: var(--muted); letter-spacing: .3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.top-btn{
  border-radius: 20px;
  color: var(--parchment);
  font-size: 22px; line-height: 1;
  cursor: pointer;
  display:flex; align-items:center; justify-content:center;
  padding: 0;
  font-family: var(--sans);
  transition: background .15s, transform .15s;
}
.top-btn:hover{ background: rgba(255,255,255,0.18); }
.top-btn:active{ transform: scale(0.95); }

@media (max-width: 820px){
  .topbar{ grid-template-columns: repeat(6, minmax(0,1fr)); }
  .stat{ grid-column: span 2; }
  .top-btn{ grid-column: span 1; }
  .top-btn:nth-child(8), .top-btn:nth-child(9){ grid-column: span 3; }
}

/* ---- Ay kartları ---- */
.grid{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width: 700px){ .grid{ grid-template-columns: 1fr 1fr; } }
@media (max-width: 460px){ .grid{ grid-template-columns: 1fr; } }
.month{
  border-radius: 24px;
  padding: 16px 14px 18px;
}
.month h2{
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 1px;
  margin: 0 0 12px;
  padding: 0 4px;
  color: var(--parchment);
  display:flex;
  justify-content: space-between;
  align-items: baseline;
}
.month h2 .count{ font-family: var(--sans); font-size: 11px; color: var(--muted); }

/* ---- Takvim: 7 sütunlu CSS Grid ---- */
.cal{
  display:grid;
  grid-template-columns: repeat(7, 1fr);
  row-gap: 5px;
  justify-items: center;
  align-items: center;
  font-family: var(--sans);
}
.cal .wd{ font-size: 10px; color: var(--muted); padding-bottom: 4px; }
.day{
  width: 26px; height: 26px;
  line-height: 26px;
  text-align: center;
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
  border-radius: 50%;
  color: #c3d0e2;
  cursor: context-menu;
  position: relative;
  transition: background 0.15s, color 0.15s;
}
.day:hover{ box-shadow: inset 0 0 0 1px var(--muted); }
.day.today{ box-shadow: inset 0 0 0 1.5px var(--gold); color: #fff; }
.day.full{ background: var(--ember); color: transparent; font-weight: 600; }
.day.full::after{
  content: '✓';
  position: absolute;
  inset: 0;
  color: #fff;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 700;
}
.day.full.today{ box-shadow: inset 0 0 0 1.5px var(--gold); }
.day.rest{ background: rgba(124,108,230,0.55); color: transparent; }
.day.rest::after{
  content: '☾';
  position: absolute;
  inset: 0;
  color: #fff;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 700;
}
.day.rest.today{ box-shadow: inset 0 0 0 1.5px var(--gold); }
.day.filler{ visibility: hidden; cursor: default; }

/* ---- Modal ---- */
.modal-overlay{
  position: fixed; inset:0;
  background: rgba(6,12,24,0.50);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  display:flex; align-items:center; justify-content:center;
  z-index: 300;
  padding: 20px;
}
.modal-box{
  background: var(--glass-strong);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid var(--glass-line);
  border-radius: 26px;
  width: min(380px, 100%);
  max-height: 82vh;
  overflow-y: auto;
  padding: 18px 20px 22px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.25);
  font-family: var(--sans);
}
.modal-head{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--panel-line);
}
.modal-title{ font-family: Georgia, serif; font-size: 17px; color: var(--parchment); }
.modal-close{ background:none; border:none; color:var(--muted); font-size:22px; cursor:pointer; line-height:1; padding: 2px 6px; }
.modal-close:hover{ color: var(--parchment); }
.modal-empty, .modal-info{ font-size: 12.5px; color: var(--muted); line-height:1.6; padding: 4px 2px 10px; }

/* modal içindeki küçük butonlar */
.icon-btn{
  background: rgba(255,255,255,0.10);
  border: 1px solid var(--glass-line);
  color: var(--parchment);
  border-radius: 12px;
  cursor: pointer;
  font-family: var(--sans);

}
.icon-btn:hover{ background: rgba(255,255,255,0.18); }
.icon-btn.wide{ padding:9px 15px; font-size:12.5px; }
.icon-btn.rest-btn.active{ background: rgba(124,108,230,0.55); border-color: rgba(179,168,255,0.85); color:#fff; }
.rest-note{ margin:8px 0 0; padding:0 2px; font-size:11.5px; line-height:1.5; color:#b3a8ff; }

.goal-item{
  display:flex; align-items:center; gap:10px;
  padding: 10px 4px;
  border-top:1px solid var(--panel-line);
  font-size:14px;
  cursor:pointer;
}
.goal-item:first-of-type{ border-top:none; }
.goal-item .num{ color:var(--muted); font-size:12px; width:18px; flex-shrink:0; }
.goal-item input[type=checkbox]{ width:16px; height:16px; accent-color: var(--ember); flex-shrink:0; }
.goal-item-name{ flex:1; }
.goal-config-row{
  display:flex; align-items:center; gap: 10px;
  padding: 9px 0;
  border-top: 1px solid var(--panel-line);
}
.goal-config-row:first-of-type{ border-top: none; }
.goal-config-row .num{ color:var(--muted); font-size:12px; width:18px; flex-shrink:0; }
.goal-name{
  flex: 1;
  min-width: 0;
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--panel-line);
  color: var(--parchment);
  font-family: var(--sans);
  font-size: 13px;
  padding: 7px 10px;
  border-radius: 10px;
}
.goal-name::placeholder{ color: #7f93ab; }
.day-toggles{ display:flex; gap: 4px; flex-shrink:0; }
.day-toggle{
  width: 24px; height: 24px;
  border-radius: 8px;
  border: 1px solid var(--panel-line);
  background: transparent;
  color: var(--muted);
  font-size: 9.5px;
  cursor: pointer;
  font-family: var(--sans);
  padding: 0;
}
.day-toggle.active{
  background: var(--ember);
  border-color: var(--ember);
  color: #fff;
  font-weight: 600;
}
.reminder-row{ display:flex; align-items:center; gap:10px; padding: 9px 2px; font-size: 13.5px; }
.reminder-row input[type=time]{
  background: rgba(255,255,255,0.08); border:1px solid var(--panel-line); color:var(--parchment);
  border-radius:10px; padding:6px 8px; font-family:var(--sans); font-size:13px;
}
.reminder-row input[type=checkbox]{ width:16px; height:16px; accent-color:var(--ember); }
.backup-row{ display:flex; gap:10px; margin-top: 6px; flex-wrap: wrap; }
.field-full{ width:100%; }

/* ---- Gün penceresi: hedefler + hikâye ---- */
.day-brief-box{
  width:min(1040px, 100%);
  max-height: 90vh;
  padding:24px 26px 28px;
  background: rgba(14,26,46,0.78);
}
.day-brief-body{
  display:grid;
  grid-template-columns:minmax(230px, .6fr) minmax(0, 1.4fr);
  min-height:320px;
}
.day-brief-goals{ padding:4px 24px 4px 0; align-self:start; position:sticky; top:0; }
.day-brief-kicker, .day-brief-caption{
  display:block; color:var(--gold); font:700 12px/1.4 var(--sans);
  letter-spacing:1.6px; margin-bottom:12px;
}
.day-brief-story{ border-left:1px solid var(--panel-line); padding:4px 0 0 30px; }
.day-brief-motto{ margin:0 0 22px; color:#edbd32; font-size:15px; font-style:italic; line-height:1.55; }
.day-brief-name{ margin:0 0 8px; color:#fff; font-size:34px; font-weight:400; letter-spacing:.3px; line-height:1.15; }
.day-brief-tagline{ margin:0 0 24px; color:var(--muted); font:14.5px/1.6 var(--sans); }
.day-brief-text{ margin:0 0 16px; color:#e6edf7; font:16px/1.85 Georgia, 'Iowan Old Style', serif; max-width:62ch; }
.day-brief-steps{ list-style:none; margin:8px 0 26px; padding:0; counter-reset:step; display:grid; gap:10px; }
.day-brief-steps li{
  position:relative; counter-increment:step;
  padding:13px 16px 13px 56px;
  background:rgba(255,255,255,0.07);
  border:1px solid var(--panel-line);
  border-radius:16px;
  color:#fff; font:14px/1.65 var(--sans);
}
.day-brief-steps li::before{
  content:counter(step);
  position:absolute; left:15px; top:50%; transform:translateY(-50%);
  width:28px; height:28px; border-radius:50%;
  background:var(--ember); color:#fff;
  font:700 12.5px/28px var(--sans); text-align:center;
}
.day-brief-lesson{
  margin:0 0 26px; padding:16px 18px; border-radius:18px;
  background:rgba(94,184,255,0.12); border:1px solid rgba(94,184,255,0.35);
  color:#fff; font:14.5px/1.7 var(--sans);
}
.day-brief-lesson strong{ display:block; margin-bottom:6px; color:var(--gold); font-size:11.5px; letter-spacing:1.4px; }
.day-brief-note{
  margin:0; padding-left:16px; border-left:3px solid var(--gold);
  color:#fff; font-size:20px; font-style:italic; line-height:1.6;
}
@media (max-width:700px){
  .day-brief-box{ padding:18px 16px 22px; }
  .day-brief-body{ grid-template-columns:1fr; }
  .day-brief-goals{ position:static; padding:4px 0 18px; }
  .day-brief-story{ border-left:0; border-top:1px solid var(--panel-line); padding:20px 0 0; }
  .day-brief-name{ font-size:27px; }
  .day-brief-text{ font-size:15.5px; }
  .day-brief-note{ font-size:18px; }
}
</style>

<body>
<div class="wrap">
  <header>
    <h1>2026 — Zincirini Kırma</h1>
    <div class="topbar">
      <div class="stat glass"><div class="num" id="streakBest">0</div><span class="lbl">EN UZUN ZİNCİR</span></div>
      <div class="stat glass"><div class="num" id="totalDays">0</div><span class="lbl">TAM GÜN</span></div>
      <div class="stat glass"><div class="num" id="halfDays">0</div><span class="lbl">YARIM GÜN</span></div>
      <div class="stat glass"><div class="num" id="undoneDays">0</div><span class="lbl">YAPILMAMIŞ GÜN</span></div>
      <div class="stat glass rest-stat"><div class="num" id="restCount">0</div><span class="lbl">DİNLENME GÜNÜ</span></div>
      <button class="top-btn glass" id="reminderBtn" title="Hatırlatıcı">🔔</button>
      <button class="top-btn glass" id="backupBtn" title="Yedekle / Geri Yükle">💾</button>
      <button class="top-btn glass" id="accountBtn" title="Hesap">👤</button>
      <button class="top-btn glass" id="goalsBtn" title="Hedefleri düzenle">⋮</button>
    </div>
  </header>
  <div class="grid" id="grid"></div>
</div>
<script>
const monthNames = ["OCAK","ŞUBAT","MART","NİSAN","MAYIS","HAZİRAN","TEMMUZ","AĞUSTOS","EYLÜL","EKİM","KASIM","ARALIK"];
const dayLetters = ["Pt","Sl","Çr","Pr","Cm","Ct","Pz"];
const YEAR = 2026;

function getLocalDateStr(date){
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
const todayStr = getLocalDateStr(new Date());
const GOALS_KEY = 'goals-2026-v2';
const COMPLETIONS_KEY = 'completions-2026';
const REMINDER_KEY = 'reminder-2026';
const REST_KEY = 'rest-2026';
const SKIP_KEY = 'skip-2026';

let goals = [];
let completions = {};
let restDays = {};
let skipDays = {};
let reminder = { enabled:false, time:'20:00', lastNotifiedDate:null };
let currentUser = null;
let firestoreUnsub = null;

function defaultGoals(){
  const list = [];
  for(let i=1;i<=12;i++) list.push({ id:'g'+i, name:'', days:[0,1,2,3,4,5,6] });
  return list;
}

function loadState(){
  try{ const g = localStorage.getItem(GOALS_KEY); goals = g ? JSON.parse(g) : defaultGoals(); }
  catch(e){ goals = defaultGoals(); }
  try{ const c = localStorage.getItem(COMPLETIONS_KEY); completions = c ? JSON.parse(c) : {}; }
  catch(e){ completions = {}; }
  try{ const rd = localStorage.getItem(REST_KEY); restDays = rd ? JSON.parse(rd) : {}; }
  catch(e){ restDays = {}; }
  try{ const sk = localStorage.getItem(SKIP_KEY); skipDays = sk ? JSON.parse(sk) : {}; }
  catch(e){ skipDays = {}; }
  try{ const r = localStorage.getItem(REMINDER_KEY); if(r) reminder = JSON.parse(r); }
  catch(e){}
}

function pushToCloud(){
  if(cloudEnabled && currentUser){
    firebase.firestore().collection('users').doc(currentUser.uid)
      .set({ goals, completions, reminder, restDays, skipDays }).catch(() => {});
  }
}
function saveGoals(){ try{ localStorage.setItem(GOALS_KEY, JSON.stringify(goals)); }catch(e){} pushToCloud(); }
function saveCompletions(){ try{ localStorage.setItem(COMPLETIONS_KEY, JSON.stringify(completions)); }catch(e){} pushToCloud(); }
function saveReminder(){ try{ localStorage.setItem(REMINDER_KEY, JSON.stringify(reminder)); }catch(e){} pushToCloud(); }
function saveSkip(){ try{ localStorage.setItem(SKIP_KEY, JSON.stringify(skipDays)); }catch(e){} pushToCloud(); }
function saveRest(){ try{ localStorage.setItem(REST_KEY, JSON.stringify(restDays)); }catch(e){} pushToCloud(); }

function weekdayIndex(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const wd = new Date(y, m-1, d).getDay();
  return (wd === 0) ? 6 : wd - 1;
}

function dayOfYearIndex(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const start = Date.UTC(y,0,1);
  const cur = Date.UTC(y,m-1,d);
  return Math.round((cur - start) / 86400000);
}

// Bir günün hedeflerinin yüzde kaçının tamamlandığını ve o gün hiç hedef olup olmadığını döndürür.
// "Yok Say" ile işaretlenen hedefler o gün hesaba katılmaz.
function dayInfo(dateStr){
  const wd = weekdayIndex(dateStr);
  const skipped = skipDays[dateStr] || [];
  const applicable = goals.filter(g => g.name.trim() !== '' && g.days.includes(wd) && !skipped.includes(g.id));
  if(applicable.length === 0) return { percent: 0, hasGoals: false };
  const done = new Set(completions[dateStr] || []);
  const doneCount = applicable.filter(g => done.has(g.id)).length;
  return { percent: Math.round((doneCount / applicable.length) * 100), hasGoals: true };
}
function dayPercent(dateStr){ return dayInfo(dateStr).percent; }

function toggleGoalCompletion(dateStr, goalId, checked){
  if(!completions[dateStr]) completions[dateStr] = [];
  const idx = completions[dateStr].indexOf(goalId);
  if(checked && idx === -1) completions[dateStr].push(goalId);
  if(!checked && idx !== -1) completions[dateStr].splice(idx,1);
  if(completions[dateStr].length === 0) delete completions[dateStr];
  saveCompletions();
  renderGrid();
  renderStats();
}

function toggleSkip(dateStr, goalId, on){
  const list = skipDays[dateStr] || [];
  const i = list.indexOf(goalId);
  if(on && i === -1) list.push(goalId);
  if(!on && i !== -1) list.splice(i,1);
  if(list.length) skipDays[dateStr] = list; else delete skipDays[dateStr];
  saveSkip();
  renderGrid();
  renderStats();
}

function setRestDay(dateStr, on){
  if(on) restDays[dateStr] = true; else delete restDays[dateStr];
  saveRest();
  renderGrid();
  renderStats();
}

// ---------- Modal sistemi ----------
let overlayEl = null;
function closeModal(){
  if(overlayEl){ overlayEl.remove(); overlayEl = null; }
  document.removeEventListener('keydown', escHandler);
}
function escHandler(e){ if(e.key === 'Escape') closeModal(); }
function openModal(titleText, buildBody, boxVariant = ''){
  closeModal();
  overlayEl = document.createElement('div');
  overlayEl.className = 'modal-overlay';
  overlayEl.addEventListener('click', (e) => { if(e.target === overlayEl) closeModal(); });
  const box = document.createElement('div');
  box.className = 'modal-box' + (boxVariant ? ' ' + boxVariant : '');
  const head = document.createElement('div');
  head.className = 'modal-head';
  const t = document.createElement('div');
  t.className = 'modal-title';
  t.textContent = titleText;
  const closeBtn = document.createElement('button');
  closeBtn.className = 'modal-close';
  closeBtn.textContent = '×';
  closeBtn.addEventListener('click', closeModal);
  head.appendChild(t);
  head.appendChild(closeBtn);
  box.appendChild(head);
  const body = document.createElement('div');
  box.appendChild(body);
  buildBody(body);
  overlayEl.appendChild(box);
  document.body.appendChild(overlayEl);
  document.addEventListener('keydown', escHandler);
}

    restNote.className = 'rest-note';
    restNote.textContent = 'Dinlenme günü: zinciri bozmaz ve yapılmamış gün sayılmaz.';

      restButton.className = 'icon-btn wide rest-btn' + (on ? ' active' : '');
      restButton.textContent = on ? '☾ Dinlenme Günü ✓' : '☾ Dinlenme Günü';
      restNote.style.display = on ? 'block' : 'none';
    };
    restButton.addEventListener('click', () => {
      setRestDay(dateStr, !restDays[dateStr]);
      paintRest();
    });
    paintRest();
    goalsColumn.appendChild(restButton);
    goalsColumn.appendChild(restNote);

    // Yok Say: tiklenen rutinler o gün için sayılmaz
    if(dayGoals.length > 0){
      const skipButton = document.createElement('button');
      skipButton.type = 'button';
      skipButton.style.cssText = 'width: 100%; margin-top: 8px;';
      skipButton.className = 'icon-btn wide rest-btn' + (skippedNow.length ? ' active' : '');
      skipButton.textContent = 'Yok Say' + (skippedNow.length ? ' (' + skippedNow.length + ')' : '');

      const skipPanel = document.createElement('div');
      skipPanel.style.display = showSkip ? 'block' : 'none';
      skipPanel.style.marginTop = '8px';

      const skipInfo = document.createElement('div');
      skipInfo.className = 'rest-note';
      skipInfo.textContent = 'Tik attığın rutin bu gün için sayılmaz.';
      skipPanel.appendChild(skipInfo);

      dayGoals.forEach((g, i) => {
        const row = document.createElement('label');
        row.className = 'goal-item skip-item';
        const num = document.createElement('span');
        num.className = 'num';
        num.textContent = (i + 1) + '.';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = skippedNow.includes(g.id);
        cb.addEventListener('change', () => {
          toggleSkip(dateStr, g.id, cb.checked);
          openDayModal(dateStr, true);
        });
        const span = document.createElement('span');
        span.className = 'goal-item-name';
        span.textContent = g.name;
        row.append(num, cb, span);
        skipPanel.appendChild(row);
      });

      skipButton.addEventListener('click', () => {
        skipPanel.style.display = (skipPanel.style.display === 'none') ? 'block' : 'none';
      });
      goalsColumn.appendChild(skipButton);
      goalsColumn.appendChild(skipPanel);
    }

    const storyColumn = document.createElement('section');
    storyColumn.className = 'day-brief-story';

    const heading = document.createElement('span');
    heading.className = 'day-brief-caption';
    heading.textContent = 'THE BEST IN THE WORLD';
    const motto = document.createElement('p');
    motto.className = 'day-brief-motto';
    motto.textContent = '“Bir yola baş koyduysan ve söz verdiysen, ölürsün ama yine de geri dönmezsin.”';
    const name = document.createElement('h3');
    name.className = 'day-brief-name';
    name.textContent = story.name;
    const tagline = document.createElement('p');
    tagline.className = 'day-brief-tagline';
    tagline.textContent = story.summary;
    storyColumn.append(heading, motto, name, tagline);

    story.story.forEach(text => {
      const p = document.createElement('p');
      p.className = 'day-brief-text';
      p.textContent = text;
      storyColumn.appendChild(p);
    });

    const stepsCaption = document.createElement('span');
    stepsCaption.className = 'day-brief-caption';
    stepsCaption.textContent = 'DÖNÜM NOKTALARI';
    const steps = document.createElement('ol');
    steps.className = 'day-brief-steps';
    story.challenges.forEach(item => {
      const li = document.createElement('li');
      li.textContent = item;
      steps.appendChild(li);
    });
    storyColumn.append(stepsCaption, steps);

    const lesson = document.createElement('div');
    lesson.className = 'day-brief-lesson';
    const lessonTitle = document.createElement('strong');
    lessonTitle.textContent = 'BUGÜN İÇİN DERS';

    storyColumn.appendChild(lesson);

    const quoteCaption = document.createElement('span');
    quoteCaption.className = 'day-brief-caption';
    quoteCaption.textContent = 'EN ÖNEMLİ SÖZÜ';

    importantQuote.className = 'day-brief-note';

    body.append(goalsColumn, storyColumn);
  }, 'day-brief-box');

function openReminderModal(){

    const timeLbl = document.createElement('span');

    const timeInput = document.createElement('input');
    timeInput.type = 'time';
    timeInput.value = reminder.time;

    timeRow.appendChild(timeLbl);

    const enableRow = document.createElement('label');

    const permStatus = document.createElement('div');
    permStatus.className = 'modal-info';
    function refreshPermStatus(){
      if(!('Notification' in window)){ permStatus.textContent = 'Bu tarayıcı bildirimleri desteklemiyor.'; return; }
      const p = Notification.permission;
      permStatus.textContent = 'İzin durumu: ' + (p === 'granted' ? 'verildi' : p === 'denied' ? 'reddedildi — tarayıcı ayarlarından açman gerekir' : 'henüz istenmedi');
    }
    enableCb.addEventListener('change', () => {
      reminder.enabled = enableCb.checked;
      saveReminder();
      if(reminder.enabled && 'Notification' in window && Notification.permission === 'default'){
        Notification.requestPermission().then(refreshPermStatus);
      } else {
        refreshPermStatus();
      }
    });
    enableRow.appendChild(enableCb);
    enableRow.appendChild(document.createTextNode(' Bildirimleri aç'));
    body.appendChild(enableRow);
    body.appendChild(permStatus);

// ---------- Yedekleme (dışa aktar / içe aktar) ----------
function exportBackup(){
  const data = { goals, completions, reminder, restDays, skipDays, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'zincir-2026-yedek.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(Array.isArray(data.goals)) goals = data.goals;
      if(data.completions && typeof data.completions === 'object') completions = data.completions;
      if(data.reminder && typeof data.reminder === 'object') reminder = data.reminder;
      if(data.restDays && typeof data.restDays === 'object') restDays = data.restDays;
      if(data.skipDays && typeof data.skipDays === 'object') skipDays = data.skipDays;
      saveGoals(); saveCompletions(); saveReminder(); saveRest(); saveSkip();
      renderGrid(); renderStats();
      alert('Yedek geri yüklendi.');
    }catch(e){
      alert('Dosya okunamadı, geçerli bir yedek dosyası seç.');
    }
  };
  reader.readAsText(file);
}

function openBackupModal(){
  openModal('Yedekleme', (body) => {
    const info = document.createElement('div');
    info.className = 'modal-info';
    info.textContent = 'Hesapla giriş yapmadıysan veriler sadece bu cihazdaki tarayıcıda saklanır. Ekstra güvenlik için ara sıra bir dosyaya yedek alıp saklayabilir, gerektiğinde aynı dosyadan geri yükleyebilirsin.';
    body.appendChild(info);

    const row = document.createElement('div');
    row.className = 'backup-row';

    const exportBtn = document.createElement('button');
    exportBtn.type = 'button';
    exportBtn.className = 'icon-btn wide';
    exportBtn.textContent = 'Yedeği İndir';
    exportBtn.addEventListener('click', exportBackup);

    const importLabel = document.createElement('label');
    importLabel.className = 'icon-btn wide';
    importLabel.textContent = 'Dosyadan Geri Yükle';
    importLabel.style.cursor = 'pointer';
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'application/json';
    fileInput.style.display = 'none';
    fileInput.addEventListener('change', (e) => {
      if(e.target.files && e.target.files[0]) importBackupFile(e.target.files[0]);
    });
    importLabel.appendChild(fileInput);

    row.appendChild(exportBtn);
    row.appendChild(importLabel);
    body.appendChild(row);
  });
}

// ---------- Hesap / Bulut senkronu ----------
function updateAccountUI(){
  const btn = document.getElementById('accountBtn');
  if(!btn) return;
  if(currentUser){
    btn.textContent = '🟢';
    btn.title = 'Hesap: ' + currentUser.email;
  } else {
    btn.textContent = '👤';
    btn.title = 'Hesap';
  }
}

function applyRemoteData(data){
  if(Array.isArray(data.goals)) goals = data.goals;
  if(data.completions && typeof data.completions === 'object') completions = data.completions;
  if(data.reminder && typeof data.reminder === 'object') reminder = data.reminder;
  if(data.restDays && typeof data.restDays === 'object') restDays = data.restDays;
  if(data.skipDays && typeof data.skipDays === 'object') skipDays = data.skipDays;
  try{ localStorage.setItem(GOALS_KEY, JSON.stringify(goals)); }catch(e){}
  try{ localStorage.setItem(COMPLETIONS_KEY, JSON.stringify(completions)); }catch(e){}
  try{ localStorage.setItem(REMINDER_KEY, JSON.stringify(reminder)); }catch(e){}
  try{ localStorage.setItem(REST_KEY, JSON.stringify(restDays)); }catch(e){}
  try{ localStorage.setItem(SKIP_KEY, JSON.stringify(skipDays)); }catch(e){}
  renderGrid();
  renderStats();
}

function initCloudSync(){
  if(!cloudEnabled){ updateAccountUI(); return; }
  firebase.auth().onAuthStateChanged((user) => {
    currentUser = user;
    updateAccountUI();
    if(firestoreUnsub){ firestoreUnsub(); firestoreUnsub = null; }
    if(user){
      const ref = firebase.firestore().collection('users').doc(user.uid);
      ref.get().then((snap) => {
        if(!snap.exists){
          ref.set({ goals, completions, reminder, restDays, skipDays });
        }
      });
      firestoreUnsub = ref.onSnapshot((snap) => {
        if(snap.metadata.hasPendingWrites) return; // kendi yazdığımız veriyi geri okuyup üzerine yazma
        if(snap.exists) applyRemoteData(snap.data());
      });
    }
  });
}

const grid = document.getElementById('grid');
function renderGrid(){
  grid.innerHTML = '';
  for(let m=0; m<12; m++){
    const first = new Date(YEAR, m, 1);
    const daysInMonth = new Date(YEAR, m+1, 0).getDate();
    let startCol = first.getDay();
    startCol = (startCol === 0) ? 6 : startCol - 1;

    const monthDiv = document.createElement('div');
    monthDiv.className = 'month glass';

    let fullInMonth = 0;
    for(let d=1; d<=daysInMonth; d++){
      const ds = `${YEAR}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if(!restDays[ds] && dayPercent(ds) === 100) fullInMonth++;
    }

    const h2 = document.createElement('h2');
    const nameSpan = document.createElement('span');
    nameSpan.textContent = monthNames[m];
    const countSpan = document.createElement('span');
    countSpan.className = 'count';
    countSpan.textContent = `${fullInMonth}/${daysInMonth}`;
    h2.appendChild(nameSpan);
    h2.appendChild(countSpan);
    monthDiv.appendChild(h2);

    const cal = document.createElement('div');
    cal.className = 'cal';
    dayLetters.forEach(dl => {
      const w = document.createElement('div');
      w.className = 'wd';
      w.textContent = dl;
      cal.appendChild(w);
    });

    for(let i=0;i<startCol;i++){
      const filler = document.createElement('div');
      filler.className = 'day filler';
      cal.appendChild(filler);
    }
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${YEAR}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const div = document.createElement('div');
      const percent = dayPercent(dateStr);
      const isRest = !!restDays[dateStr];

      div.className = 'day' + (isRest ? ' rest' : (percent === 100 ? ' full' : ''));
      if(!isRest && percent > 0 && percent < 100){
        const deg = percent * 3.6;
        const color = percent < 50 ? '#ef4444' : 'var(--ember)';
        div.style.background = `conic-gradient(${color} 0deg ${deg}deg, transparent ${deg}deg 360deg)`;
      }
      div.title = isRest ? 'Dinlenme günü' : ((percent > 0 && percent < 100) ? (percent + '%') : '');

      div.textContent = d;
      if(dateStr === todayStr) div.classList.add('today');
      // Her iki olay da çalışsın: tek tık ve sağ tık
      div.addEventListener('click', (e) => {
        if(e.target === div || e.target.tagName === 'DIV') openDayModal(dateStr);
      });
      div.addEventListener('contextmenu', (e) => { e.preventDefault(); openDayModal(dateStr); });
      cal.appendChild(div);
    }
    monthDiv.appendChild(cal);
    grid.appendChild(monthDiv);
  }
}

// ---------- İstatistikler ----------
// Dinlenme günleri zinciri bozmaz; yarım / yapılmamış gün olarak da sayılmaz.
function calcStreaks(){
  let total = 0, halfCount = 0, undoneCount = 0, restCount = 0;
  let best = 0, run = 0;
  for(let m=0;m<12;m++){
    const daysInMonth = new Date(YEAR, m+1, 0).getDate();
    for(let d=1; d<=daysInMonth; d++){
      const ds = `${YEAR}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if(restDays[ds]){ restCount++; continue; }
      const info = dayInfo(ds);
      if(info.percent === 100){
        total++; run++;
        if(run > best) best = run;
      } else {
        run = 0;
      }
      if(ds <= todayStr && info.hasGoals){
        if(info.percent === 0) undoneCount++;
        else if(info.percent < 100) halfCount++;
      }
    }
  }
  let c = 0;
  const cursor = new Date(todayStr);
  for(let i=0; i<366; i++){
    const ds = getLocalDateStr(cursor);
    if(restDays[ds]){ /* dinlenme günü: seriyi bozmaz */ }
    else if(dayInfo(ds).percent === 100){ c++; }
    else { break; }
    cursor.setDate(cursor.getDate()-1);
  }
  return { best, current: c, total, half: halfCount, undone: undoneCount, rest: restCount };
}

function renderStats(){
  const s = calcStreaks();
  document.getElementById('streakBest').textContent = s.best;
  document.getElementById('totalDays').textContent = s.total;
  document.getElementById('halfDays').textContent = s.half;
  document.getElementById('undoneDays').textContent = s.undone;
  document.getElementById('restCount').textContent = s.rest;
}

// ---------- Hatırlatıcı döngüsü (sayfa açıkken) ----------
function checkReminder(){
  if(!reminder.enabled) return;
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  const cur = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  const today = getLocalDateStr(now);
  if(cur === reminder.time && reminder.lastNotifiedDate !== today){
    if(dayPercent(today) !== 100 && !restDays[today]){
      try{ new Notification('Zincirini kırma!', { body: 'Bugünü henüz işaretlemedin.' }); }catch(e){}
    }
    reminder.lastNotifiedDate = today;
    saveReminder();
  }
}
