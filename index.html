<style>
:root{
  --bg: #0b1424;
  --parchment: #eef3fa;
  --gold: #5eb8ff;
  --ember: #3f8ed9;
  --muted: #9db0c8;
  --glass: rgba(255,255,255,0.09);
  --glass-strong: rgba(18,32,54,0.62);
  --glass-line: rgba(255,255,255,0.20);
  --panel-line: rgba(255,255,255,0.16);
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.28);
  --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;}
html{ background: var(--bg); }
body{
  margin:0;
  min-height:100vh;
  background: transparent;
  color: var(--parchment);
  font-family: 'Georgia', 'Iowan Old Style', serif;
  padding: calc(28px + env(safe-area-inset-top, 0px)) 20px calc(40px + env(safe-area-inset-bottom, 0px));
}
/* Cam efektinin görünmesi için renkli, sabit arka plan */
body::before{
  content:'';
  position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(55% 45% at 12% 8%, rgba(63,142,217,0.60), transparent 70%),
    radial-gradient(50% 42% at 92% 18%, rgba(112,92,220,0.42), transparent 70%),
    radial-gradient(60% 50% at 75% 96%, rgba(40,170,200,0.38), transparent 70%),
    radial-gradient(45% 40% at 5% 80%, rgba(70,110,230,0.30), transparent 70%),
    #0b1424;
}
.wrap{ max-width: 980px; margin: 0 auto; }
header{ margin-bottom: 20px; }
h1{
  font-size: 34px;
  letter-spacing: 0.5px;
  margin: 0 0 18px;
  font-weight: 400;
  color: var(--parchment);
}

/* ---- Cam panel (ortak) ---- */
.glass{
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid var(--glass-line);
  box-shadow: var(--glass-shadow);
}

/* ---- Üst sıra: 4 istatistik + 4 buton, tek çizgi ---- */
.topbar{
  display:grid;
  grid-template-columns: repeat(4, minmax(0,1fr)) repeat(4, 60px);
  grid-auto-rows: 64px;
  gap: 12px;
  align-items: stretch;
  font-family: var(--sans);
}
.stat{
  border-radius: 20px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap: 5px;
  padding: 0 8px;
  min-width: 0;
}
.stat .num{ font-family: Georgia, serif; font-size: 26px; color: var(--gold); line-height:1; }
.stat .lbl{
  font-size: 10.5px; color: var(--muted); letter-spacing: .3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.top-btn{
  border-radius: 20px;
  color: var(--parchment);
  font-size: 22px; line-height: 1;
  cursor: pointer;
  display:flex; align-items:center; justify-content:center;
  padding: 0;
  font-family: var(--sans);
  transition: background .15s, transform .15s;
}
.top-btn:hover{ background: rgba(255,255,255,0.18); }
.top-btn:active{ transform: scale(0.95); }

@media (max-width: 820px){
  .topbar{ grid-template-columns: repeat(4, minmax(0,1fr)); }
  .stat{ grid-column: span 2; }
  .top-btn{ grid-column: span 1; }
}

/* ---- Ay kartları ---- */
.grid{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width: 700px){ .grid{ grid-template-columns: 1fr 1fr; } }
@media (max-width: 460px){ .grid{ grid-template-columns: 1fr; } }
.month{
  border-radius: 24px;
  padding: 16px 14px 18px;
}
.month h2{
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 1px;
  margin: 0 0 12px;
  padding: 0 4px;
  color: var(--parchment);
  display:flex;
  justify-content: space-between;
  align-items: baseline;
}
.month h2 .count{ font-family: var(--sans); font-size: 11px; color: var(--muted); }

/* ---- Takvim: 7 sütunlu CSS Grid ---- */
.cal{
  display:grid;
  grid-template-columns: repeat(7, 1fr);
  row-gap: 5px;
  justify-items: center;
  align-items: center;
  font-family: var(--sans);
}
.cal .wd{ font-size: 10px; color: var(--muted); padding-bottom: 4px; }
.day{
  width: 26px; height: 26px;
  line-height: 26px;
  text-align: center;
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
  border-radius: 50%;
  color: #c3d0e2;
  cursor: context-menu;
  position: relative;
  transition: background 0.15s, color 0.15s;
}
.day:hover{ box-shadow: inset 0 0 0 1px var(--muted); }
.day.today{ box-shadow: inset 0 0 0 1.5px var(--gold); color: #fff; }
.day.full{ background: var(--ember); color: transparent; font-weight: 600; }
.day.full::after{
  content: '✓';
  position: absolute;
  inset: 0;
  color: #fff;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 700;
}
.day.full.today{ box-shadow: inset 0 0 0 1.5px var(--gold); }
.day.filler{ visibility: hidden; cursor: default; }

/* ---- Modal ---- */
.modal-overlay{
  position: fixed; inset:0;
  background: rgba(6,12,24,0.50);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  display:flex; align-items:center; justify-content:center;
  z-index: 300;
  padding: 20px;
}
.modal-box{
  background: var(--glass-strong);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid var(--glass-line);
  border-radius: 26px;
  width: min(380px, 100%);
  max-height: 82vh;
  overflow-y: auto;
  padding: 18px 20px 22px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.25);
  font-family: var(--sans);
}
.modal-head{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--panel-line);
}
.modal-title{ font-family: Georgia, serif; font-size: 17px; color: var(--parchment); }
.modal-close{ background:none; border:none; color:var(--muted); font-size:22px; cursor:pointer; line-height:1; padding: 2px 6px; }
.modal-close:hover{ color: var(--parchment); }
.modal-empty, .modal-info{ font-size: 12.5px; color: var(--muted); line-height:1.6; padding: 4px 2px 10px; }

/* modal içindeki küçük butonlar */
.icon-btn{
  background: rgba(255,255,255,0.10);
  border: 1px solid var(--glass-line);
  color: var(--parchment);
  border-radius: 12px;
  cursor: pointer;
  font-family: var(--sans);

}
.icon-btn:hover{ background: rgba(255,255,255,0.18); }
.icon-btn.wide{ padding:9px 15px; font-size:12.5px; }

.goal-item{
  display:flex; align-items:center; gap:10px;
  padding: 10px 4px;
  border-top:1px solid var(--panel-line);
  font-size:14px;
  cursor:pointer;
}
.goal-item:first-of-type{ border-top:none; }
.goal-item .num{ color:var(--muted); font-size:12px; width:18px; flex-shrink:0; }
.goal-item input[type=checkbox]{ width:16px; height:16px; accent-color: var(--ember); flex-shrink:0; }
.goal-item-name{ flex:1; }
.goal-config-row{
  display:flex; align-items:center; gap: 10px;
  padding: 9px 0;
  border-top: 1px solid var(--panel-line);
}
.goal-config-row:first-of-type{ border-top: none; }
.goal-config-row .num{ color:var(--muted); font-size:12px; width:18px; flex-shrink:0; }
.goal-name{
  flex: 1;
  min-width: 0;
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--panel-line);
  color: var(--parchment);
  font-family: var(--sans);
  font-size: 13px;
  padding: 7px 10px;
  border-radius: 10px;
}
.goal-name::placeholder{ color: #7f93ab; }
.day-toggles{ display:flex; gap: 4px; flex-shrink:0; }
.day-toggle{
  width: 24px; height: 24px;
  border-radius: 8px;
  border: 1px solid var(--panel-line);
  background: transparent;
  color: var(--muted);
  font-size: 9.5px;
  cursor: pointer;
  font-family: var(--sans);
  padding: 0;
}
.day-toggle.active{
  background: var(--ember);
  border-color: var(--ember);
  color: #fff;
  font-weight: 600;
}
.reminder-row{ display:flex; align-items:center; gap:10px; padding: 9px 2px; font-size: 13.5px; }
.reminder-row input[type=time]{
  background: rgba(255,255,255,0.08); border:1px solid var(--panel-line); color:var(--parchment);

}
.reminder-row input[type=checkbox]{ width:16px; height:16px; accent-color:var(--ember); }
.backup-row{ display:flex; gap:10px; margin-top: 6px; flex-wrap: wrap; }
.field-full{ width:100%; }

/* ---- Gün hedef özeti: sağ tık penceresi ---- */
.day-brief-box{
  width:min(760px, 100%);
  padding:20px;
  background: rgba(14,26,46,0.70);
}
.day-brief-body{ display:grid; grid-template-columns:minmax(220px, .9fr) minmax(320px, 1.1fr); min-height:300px; }
.day-brief-goals{ padding:4px 20px 4px 0; }
.day-brief-kicker, .day-brief-caption{
  display:block; color:#fff; font:700 13px/1.4 var(--sans);
  letter-spacing:1.1px; margin-bottom:10px;
}
.day-brief-story{ border-left:1px solid var(--panel-line); padding:4px 0 0 20px; }
.day-brief-quote{ margin:0 0 18px; color:#edbd32; font-size:15px; font-style:italic; line-height:1.45; }
.day-brief-photos{ display:flex; align-items:center; justify-content:center; gap:16px; margin:10px 0 14px; }
.day-brief-photo-wrap{ width:132px; text-align:center; }
.day-brief-photo{
  display:block; width:124px; height:124px; margin:0 auto 7px; border-radius:16px;
  object-fit:cover; object-position:center;
  border:1px solid var(--panel-line); background:#284738;
  box-shadow:0 7px 16px rgba(0,0,0,.25);
}
.day-brief-photo.after{ border-color:var(--gold); }
.day-brief-photo.split-photo.before{ object-position:left center; }
.day-brief-photo.split-photo.after{ object-position:right center; }
.day-brief-photo.vintage{ filter: grayscale(88%) sepia(10%) contrast(0.92) brightness(0.95); }
.day-brief-photo.vivid{ filter: saturate(1.22) contrast(1.08) brightness(1.03); }
.day-brief-photo-label{ color:#fff; font:9px/1.2 var(--sans); letter-spacing:.7px; }
.day-brief-arrow{ color:#fff; font:20px/1 sans-serif; margin-top:-20px; }
.day-brief-name{ margin:2px 0 10px; color:#fff; text-align:center; font-size:19px; }
.day-brief-copy{ max-width:390px; margin:0 auto; color:#fff; text-align:center; font:12px/1.5 var(--sans); }

.day-brief-history li{ margin:0 0 5px; padding-left:2px; }
.day-brief-important-caption{ margin:12px 0 4px; text-align:center; }
.day-brief-note{ margin:3px 0 0; color:#fff; text-align:center; font-size:16px; font-style:italic; line-height:1.55; font-weight:500; }

  .day-brief-photo-wrap{ width:112px; }
  .day-brief-photo{ width:104px; height:104px; }
  .day-brief-history{ font-size:11px; }
}
</style>

<script>
const monthNames = ["OCAK","ŞUBAT","MART","NİSAN","MAYIS","HAZİRAN","TEMMUZ","AĞUSTOS","EYLÜL","EKİM","KASIM","ARALIK"];
const dayLetters = ["Pt","Sl","Çr","Pr","Cm","Ct","Pz"];
const YEAR = 2026;

function getLocalDateStr(date){
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
const todayStr = getLocalDateStr(new Date());
const GOALS_KEY = 'goals-2026-v2';
const COMPLETIONS_KEY = 'completions-2026';
const REMINDER_KEY = 'reminder-2026';

let goals = [];
let completions = {};
let reminder = { enabled:false, time:'20:00', lastNotifiedDate:null };
let currentUser = null;
let firestoreUnsub = null;

function defaultGoals(){
  const list = [];
  for(let i=1;i<=12;i++) list.push({ id:'g'+i, name:'', days:[0,1,2,3,4,5,6] });
  return list;
}

function loadState(){
  try{ const g = localStorage.getItem(GOALS_KEY); goals = g ? JSON.parse(g) : defaultGoals(); }
  catch(e){ goals = defaultGoals(); }
  try{ const c = localStorage.getItem(COMPLETIONS_KEY); completions = c ? JSON.parse(c) : {}; }
  catch(e){ completions = {}; }
  try{ const r = localStorage.getItem(REMINDER_KEY); if(r) reminder = JSON.parse(r); }
  catch(e){}
}

function pushToCloud(){
  if(cloudEnabled && currentUser){
    firebase.firestore().collection('users').doc(currentUser.uid)
      .set({ goals, completions, reminder }).catch(() => {});
  }
}
function saveGoals(){ try{ localStorage.setItem(GOALS_KEY, JSON.stringify(goals)); }catch(e){} pushToCloud(); }
function saveCompletions(){ try{ localStorage.setItem(COMPLETIONS_KEY, JSON.stringify(completions)); }catch(e){} pushToCloud(); }
function saveReminder(){ try{ localStorage.setItem(REMINDER_KEY, JSON.stringify(reminder)); }catch(e){} pushToCloud(); }

function weekdayIndex(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const wd = new Date(y, m-1, d).getDay();
  return (wd === 0) ? 6 : wd - 1;
}

function dayOfYearIndex(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const start = Date.UTC(y,0,1);
  const cur = Date.UTC(y,m-1,d);
  return Math.round((cur - start) / 86400000);
}

// Bir günün hedeflerinin yüzde kaçının tamamlandığını ve o gün hiç hedef olup olmadığını döndürür.
function dayInfo(dateStr){
  const wd = weekdayIndex(dateStr);
  const applicable = goals.filter(g => g.name.trim() !== '' && g.days.includes(wd));
  if(applicable.length === 0) return { percent: 0, hasGoals: false };
  const done = new Set(completions[dateStr] || []);
  const doneCount = applicable.filter(g => done.has(g.id)).length;
  return { percent: Math.round((doneCount / applicable.length) * 100), hasGoals: true };
}
function dayPercent(dateStr){ return dayInfo(dateStr).percent; }

function toggleGoalCompletion(dateStr, goalId, checked){
  if(!completions[dateStr]) completions[dateStr] = [];
  const idx = completions[dateStr].indexOf(goalId);
  if(checked && idx === -1) completions[dateStr].push(goalId);
  if(!checked && idx !== -1) completions[dateStr].splice(idx,1);
  if(completions[dateStr].length === 0) delete completions[dateStr];
  saveCompletions();
  renderGrid();
  renderStats();
}

// ---------- Modal sistemi ----------
let overlayEl = null;
function closeModal(){
  if(overlayEl){ overlayEl.remove(); overlayEl = null; }
  document.removeEventListener('keydown', escHandler);
}
function escHandler(e){ if(e.key === 'Escape') closeModal(); }
function openModal(titleText, buildBody, boxVariant = ''){
  closeModal();
  overlayEl = document.createElement('div');
  overlayEl.className = 'modal-overlay';
  overlayEl.addEventListener('click', (e) => { if(e.target === overlayEl) closeModal(); });
  const box = document.createElement('div');
  box.className = 'modal-box' + (boxVariant ? ' ' + boxVariant : '');
  const head = document.createElement('div');
  head.className = 'modal-head';
  const t = document.createElement('div');
  t.className = 'modal-title';
  t.textContent = titleText;
  const closeBtn = document.createElement('button');
  closeBtn.className = 'modal-close';
  closeBtn.textContent = '×';
  closeBtn.addEventListener('click', closeModal);
  head.appendChild(t);
  head.appendChild(closeBtn);
  box.appendChild(head);
  const body = document.createElement('div');
  box.appendChild(body);
  buildBody(body);
  overlayEl.appendChild(box);
  document.body.appendChild(overlayEl);
  document.addEventListener('keydown', escHandler);
}

function openDayModal(dateStr){
  const wd = weekdayIndex(dateStr);
  const applicable = goals.filter(g => g.name.trim() !== '' && g.days.includes(wd));
  const [y,m,d] = dateStr.split('-');
  const story = featuredStories[dayOfYearIndex(dateStr) % featuredStories.length];

  openModal(`${d}.${m}.${y}`, (body) => {
    body.className = 'day-brief-body';

    const goalsColumn = document.createElement('section');
    goalsColumn.className = 'day-brief-goals';
    const goalsKicker = document.createElement('span');
    goalsKicker.className = 'day-brief-kicker';
    goalsKicker.textContent = 'GÜNÜN HEDEFLERİ';
    goalsColumn.appendChild(goalsKicker);

    if(applicable.length === 0){
      const p = document.createElement('div');
      p.className = 'modal-empty';
      p.textContent = 'Bu gün için hedef yok. ⋮ menüsünden hedef ekleyip bu günü seçebilirsin.';
      goalsColumn.appendChild(p);
    } else {
      const done = new Set(completions[dateStr] || []);
      applicable.forEach((g, i) => {
        const row = document.createElement('label');
        row.className = 'goal-item';
        const num = document.createElement('span');
        num.className = 'num';
        num.textContent = (i + 1) + '.';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = done.has(g.id);
        cb.addEventListener('change', () => toggleGoalCompletion(dateStr, g.id, cb.checked));
        const span = document.createElement('span');
        span.className = 'goal-item-name';
        span.textContent = g.name;
        row.append(num, cb, span);
        goalsColumn.appendChild(row);
      });
    }

    if(applicable.length > 0){
      const resetButton = document.createElement('button');
      resetButton.type = 'button';
      resetButton.className = 'icon-btn wide';
      resetButton.style.cssText = 'width: 100%; margin-top: 14px;';
      resetButton.textContent = 'Hepsini Sıfırla';
      resetButton.addEventListener('click', () => {
        delete completions[dateStr];
        saveCompletions();
        renderGrid();
        renderStats();
        goalsColumn.querySelectorAll('input[type="checkbox"]').forEach(cb => { cb.checked = false; });
      });
      goalsColumn.appendChild(resetButton);
    }

    const storyColumn = document.createElement('section');
    storyColumn.className = 'day-brief-story';
    const heading = document.createElement('span');
    heading.className = 'day-brief-caption';
    heading.textContent = 'THE BEST IN THE WORLD';
    const motto = document.createElement('p');
    motto.className = 'day-brief-quote';
    motto.textContent = '“Bir yola baş koyduysan ve söz verdiysen, ölürsün ama yine de geri dönmezsin.”';
    const name = document.createElement('h3');
    name.className = 'day-brief-name';
    name.textContent = story.name;

    const photos = document.createElement('div');
    photos.className = 'day-brief-photos';
    const makePhoto = (url, label, variant) => {
      const wrap = document.createElement('div');
      wrap.className = 'day-brief-photo-wrap';
      const img = document.createElement('img');
      let extraCls = story.split ? ' split-photo' : '';
      if(story.sameImage) extraCls += (variant === 'before') ? ' vintage' : ' vivid';
      img.className = 'day-brief-photo ' + variant + extraCls;
      img.src = url;
      img.alt = story.name + ' — ' + label + ' gerçek fotoğraf';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        const placeholder = document.createElement('div');
        placeholder.style.cssText = 'width:124px;height:124px;background:#3a6ea5;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;text-align:center;padding:4px;';
        placeholder.textContent = label + '\n(görsel yok)';
        this.parentElement.insertBefore(placeholder, this);
      };
      const caption = document.createElement('div');
      caption.className = 'day-brief-photo-label';
      caption.textContent = label;
      wrap.append(img, caption);
      return wrap;
    };
    photos.append(makePhoto(story.before, 'BAŞLANGIÇ', 'before'));
    const arrow = document.createElement('div');
    arrow.className = 'day-brief-arrow';
    arrow.textContent = '→';
    photos.appendChild(arrow);
    photos.append(makePhoto(story.after, 'BUGÜN', 'after'));

    const summary = document.createElement('p');
    summary.className = 'day-brief-copy';
    summary.textContent = story.summary;
    const list = document.createElement('ul');
    list.className = 'day-brief-history';
    story.challenges.forEach(item => {
      const li = document.createElement('li');
      li.textContent = item;
      list.appendChild(li);
    });
    const quoteCaption = document.createElement('span');
    quoteCaption.className = 'day-brief-caption day-brief-important-caption';
    quoteCaption.textContent = 'EN ÖNEMLİ SÖZÜ';
    const importantQuote = document.createElement('p');
    importantQuote.className = 'day-brief-note';
    importantQuote.textContent = story.quote;
    const source = document.createElement('div');
    source.className = 'day-brief-source';
    source.textContent = 'Görseller: gerçek arşiv ve editoryal fotoğraflar';

    storyColumn.append(heading, motto, name, photos, summary, list, quoteCaption, importantQuote, source);
    body.append(goalsColumn, storyColumn);
  }, 'day-brief-box');
}

function openGoalsModal(){
  openModal('12 Hedef', (body) => {
    const info = document.createElement('div');
    info.className = 'modal-info';
    info.textContent = 'İsim ver ve haftanın hangi günlerinde geçerli olduğunu seç. Bu liste her ay için aynı şekilde geçerlidir.';
    body.appendChild(info);
    goals.forEach((g, idx) => {
      const row = document.createElement('div');
      row.className = 'goal-config-row';
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = (idx+1) + '.';
      const input = document.createElement('input');
      input.className = 'goal-name';
      input.placeholder = 'Hedef ' + (idx+1);
      input.value = g.name;
      input.addEventListener('input', () => {
        g.name = input.value;
        saveGoals();
        renderGrid();
        renderStats();
      });
      const toggles = document.createElement('div');
      toggles.className = 'day-toggles';
      dayLetters.forEach((label, dayIdx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'day-toggle' + (g.days.includes(dayIdx) ? ' active' : '');
        btn.textContent = label;
        btn.addEventListener('click', () => {
          const pos = g.days.indexOf(dayIdx);
          if(pos === -1) g.days.push(dayIdx); else g.days.splice(pos,1);
          saveGoals();
          btn.classList.toggle('active');
          renderGrid();
          renderStats();
        });
        toggles.appendChild(btn);
      });
      row.appendChild(num);
      row.appendChild(input);
      row.appendChild(toggles);
      body.appendChild(row);
    });
  });
}

function openReminderModal(){
  openModal('Hatırlatıcı', (body) => {
    const info = document.createElement('div');
    info.className = 'modal-info';
    info.textContent = 'Belirlediğin saatte, o gün henüz tam işaretlenmemişse bu sekme açıkken bildirim gönderir. Uygulama tamamen kapalıyken de bildirim istiyorsan OneSignal + Zapier kurulumu ayrıca gerekir.';
    body.appendChild(info);
    const timeRow = document.createElement('div');
    timeRow.className = 'reminder-row';
    const timeLbl = document.createElement('span');
    timeLbl.textContent = 'Saat';
    const timeInput = document.createElement('input');
    timeInput.type = 'time';
    timeInput.value = reminder.time;
    timeInput.addEventListener('change', () => { reminder.time = timeInput.value; saveReminder(); });
    timeRow.appendChild(timeLbl);
    timeRow.appendChild(timeInput);
    body.appendChild(timeRow);
    const enableRow = document.createElement('label');
    enableRow.className = 'reminder-row';
    const enableCb = document.createElement('input');
    enableCb.type = 'checkbox';
    enableCb.checked = reminder.enabled;
    const permStatus = document.createElement('div');
    permStatus.className = 'modal-info';
    function refreshPermStatus(){
      if(!('Notification' in window)){ permStatus.textContent = 'Bu tarayıcı bildirimleri desteklemiyor.'; return; }
      const p = Notification.permission;
      permStatus.textContent = 'İzin durumu: ' + (p === 'granted' ? 'verildi' : p === 'denied' ? 'reddedildi — tarayıcı ayarlarından açman gerekir' : 'henüz istenmedi');
    }
    enableCb.addEventListener('change', () => {
      reminder.enabled = enableCb.checked;
      saveReminder();
      if(reminder.enabled && 'Notification' in window && Notification.permission === 'default'){
        Notification.requestPermission().then(refreshPermStatus);
      } else {
        refreshPermStatus();
      }
    });
    enableRow.appendChild(enableCb);
    enableRow.appendChild(document.createTextNode(' Bildirimleri aç'));
    body.appendChild(enableRow);
    body.appendChild(permStatus);
    refreshPermStatus();
  });
}

// ---------- Yedekleme (dışa aktar / içe aktar) ----------
function exportBackup(){
  const data = { goals, completions, reminder, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'zincir-2026-yedek.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(Array.isArray(data.goals)) goals = data.goals;
      if(data.completions && typeof data.completions === 'object') completions = data.completions;
      if(data.reminder && typeof data.reminder === 'object') reminder = data.reminder;
      saveGoals(); saveCompletions(); saveReminder();
      renderGrid(); renderStats();
      alert('Yedek geri yüklendi.');
    }catch(e){
      alert('Dosya okunamadı, geçerli bir yedek dosyası seç.');
    }
  };
  reader.readAsText(file);
}

function openBackupModal(){
  openModal('Yedekleme', (body) => {
    const info = document.createElement('div');
    info.className = 'modal-info';
    info.textContent = 'Hesapla giriş yapmadıysan veriler sadece bu cihazdaki tarayıcıda saklanır. Ekstra güvenlik için ara sıra bir dosyaya yedek alıp saklayabilir, gerektiğinde aynı dosyadan geri yükleyebilirsin.';
    body.appendChild(info);

    const row = document.createElement('div');
    row.className = 'backup-row';

    const exportBtn = document.createElement('button');
    exportBtn.type = 'button';
    exportBtn.className = 'icon-btn wide';
    exportBtn.textContent = 'Yedeği İndir';
    exportBtn.addEventListener('click', exportBackup);

    const importLabel = document.createElement('label');
    importLabel.className = 'icon-btn wide';
    importLabel.textContent = 'Dosyadan Geri Yükle';
    importLabel.style.cursor = 'pointer';
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'application/json';
    fileInput.style.display = 'none';
    fileInput.addEventListener('change', (e) => {
      if(e.target.files && e.target.files[0]) importBackupFile(e.target.files[0]);
    });
    importLabel.appendChild(fileInput);

    row.appendChild(exportBtn);
    row.appendChild(importLabel);
    body.appendChild(row);
  });
}

function updateAccountUI(){
  const btn = document.getElementById('accountBtn');
  if(!btn) return;
  if(currentUser){
    btn.textContent = '🟢';
    btn.title = 'Hesap: ' + currentUser.email;
  } else {
    btn.textContent = '👤';
    btn.title = 'Hesap';
  }
}

function applyRemoteData(data){
  if(Array.isArray(data.goals)) goals = data.goals;
  if(data.completions && typeof data.completions === 'object') completions = data.completions;
  if(data.reminder && typeof data.reminder === 'object') reminder = data.reminder;
  try{ localStorage.setItem(GOALS_KEY, JSON.stringify(goals)); }catch(e){}
  try{ localStorage.setItem(COMPLETIONS_KEY, JSON.stringify(completions)); }catch(e){}
  try{ localStorage.setItem(REMINDER_KEY, JSON.stringify(reminder)); }catch(e){}
  renderGrid();
  renderStats();
}

function initCloudSync(){
  if(!cloudEnabled){ updateAccountUI(); return; }
  firebase.auth().onAuthStateChanged((user) => {
    currentUser = user;
    updateAccountUI();
    if(firestoreUnsub){ firestoreUnsub(); firestoreUnsub = null; }
    if(user){
      const ref = firebase.firestore().collection('users').doc(user.uid);
      ref.get().then((snap) => {
        if(!snap.exists){
          ref.set({ goals, completions, reminder });
        }
      });
      firestoreUnsub = ref.onSnapshot((snap) => {
        if(snap.metadata.hasPendingWrites) return; // kendi yazdığımız veriyi geri okuyup üzerine yazma
        if(snap.exists) applyRemoteData(snap.data());
      });
    }
  });
}

function openAccountModal(){
  openModal('Hesap', (body) => {
    if(!cloudEnabled){
      const info = document.createElement('div');
      info.className = 'modal-info';
      info.textContent = 'Bulut senkronizasyonu henüz kurulmamış (dosyanın başındaki firebaseConfig alanı doldurulmalı). Şu an sadece bu cihazda saklanıyor.';
      body.appendChild(info);
      return;
    }
    if(currentUser){
      const info = document.createElement('div');
      info.className = 'modal-info';
      info.textContent = 'Giriş yapıldı: ' + currentUser.email + '. Bu hesapla giriş yaptığın her cihazda aynı veriler görünür ve birbirini günceller.';
      body.appendChild(info);
      const outBtn = document.createElement('button');
      outBtn.type = 'button';
      outBtn.className = 'icon-btn wide';
      outBtn.textContent = 'Çıkış Yap';
      outBtn.addEventListener('click', () => { firebase.auth().signOut(); closeModal(); });
      body.appendChild(outBtn);
      return;
    }
    const info = document.createElement('div');
    info.className = 'modal-info';
    info.textContent = 'Aynı verileri hem telefonda hem bilgisayarda görmek için Google hesabınla giriş yap.';
    body.appendChild(info);

    const errBox = document.createElement('div');
    errBox.className = 'modal-info';
    errBox.style.color = 'var(--ember)';
    body.appendChild(errBox);

    const googleBtn = document.createElement('button');
    googleBtn.type = 'button';
    googleBtn.className = 'icon-btn wide';
    googleBtn.style.marginTop = '4px';
    googleBtn.textContent = 'Google ile Giriş Yap';
    googleBtn.addEventListener('click', () => {
      errBox.textContent = '';
      const provider = new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(provider)
        .then(() => closeModal())
        .catch((e) => { errBox.textContent = 'Giriş başarısız: ' + e.message; });
    });
    body.appendChild(googleBtn);
  });
}

// ---------- Takvim (CSS Grid, 7 sütun) ----------
const grid = document.getElementById('grid');
function renderGrid(){
  grid.innerHTML = '';
  for(let m=0; m<12; m++){
    const first = new Date(YEAR, m, 1);
    const daysInMonth = new Date(YEAR, m+1, 0).getDate();
    let startCol = first.getDay();
    startCol = (startCol === 0) ? 6 : startCol - 1;

    const monthDiv = document.createElement('div');
    monthDiv.className = 'month glass';

    let fullInMonth = 0;
    for(let d=1; d<=daysInMonth; d++){
      const ds = `${YEAR}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if(dayPercent(ds) === 100) fullInMonth++;
    }

    const h2 = document.createElement('h2');
    const nameSpan = document.createElement('span');
    nameSpan.textContent = monthNames[m];
    const countSpan = document.createElement('span');
    countSpan.className = 'count';
    countSpan.textContent = `${fullInMonth}/${daysInMonth}`;
    h2.appendChild(nameSpan);
    h2.appendChild(countSpan);
    monthDiv.appendChild(h2);

    const cal = document.createElement('div');
    cal.className = 'cal';
    dayLetters.forEach(dl => {
      const w = document.createElement('div');
      w.className = 'wd';
      w.textContent = dl;
      cal.appendChild(w);
    });

    for(let i=0;i<startCol;i++){
      const filler = document.createElement('div');
      filler.className = 'day filler';
      cal.appendChild(filler);
    }
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${YEAR}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const div = document.createElement('div');
      const percent = dayPercent(dateStr);

      div.className = 'day' + (percent === 100 ? ' full' : '');
      if(percent > 0 && percent < 100){
        const deg = percent * 3.6;
        div.style.background = `conic-gradient(var(--ember) 0deg ${deg}deg, transparent ${deg}deg 360deg)`;
      } else if(percent === 0){
        div.style.background = '';
      }
      div.title = (percent > 0 && percent < 100) ? (percent + '%') : '';

      div.textContent = d;
      if(dateStr === todayStr) div.classList.add('today');
      // Her iki olay da çalışsın: tek tık ve sağ tık
      div.addEventListener('click', (e) => {
        if(e.target === div || e.target.tagName === 'DIV') openDayModal(dateStr);
      });
      div.addEventListener('contextmenu', (e) => { e.preventDefault(); openDayModal(dateStr); });
      cal.appendChild(div);
    }
    monthDiv.appendChild(cal);
    grid.appendChild(monthDiv);
  }
}

// ---------- İstatistikler ----------
function calcStreaks(){
  const fullDates = [];
  let halfCount = 0, undoneCount = 0;
  for(let m=0;m<12;m++){
    const daysInMonth = new Date(YEAR, m+1, 0).getDate();
    for(let d=1; d<=daysInMonth; d++){
      const ds = `${YEAR}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const info = dayInfo(ds);
      if(info.percent === 100) fullDates.push(ds);
      if(ds <= todayStr && info.hasGoals){
        if(info.percent === 0) undoneCount++;
        else if(info.percent < 100) halfCount++;
      }
    }
  }
  let best = 0, run = 0, prev = null;
  for(const d of fullDates){
    if(prev){
      const diff = (new Date(d) - new Date(prev)) / 86400000;
      run = (diff === 1) ? run + 1 : 1;
    } else { run = 1; }
    best = Math.max(best, run);
    prev = d;
  }
  let c = 0;
  let cursor = new Date(todayStr);
  const fullSet = new Set(fullDates);
  while(fullSet.has(getLocalDateStr(cursor))){
    c++;
    cursor.setDate(cursor.getDate()-1);
  }
  return { best, current: c, total: fullDates.length, half: halfCount, undone: undoneCount };
}

function renderStats(){
  const s = calcStreaks();
  document.getElementById('streakBest').textContent = s.best;
  document.getElementById('totalDays').textContent = s.total;
  document.getElementById('halfDays').textContent = s.half;
  document.getElementById('undoneDays').textContent = s.undone;
}

// ---------- Hatırlatıcı döngüsü (sayfa açıkken) ----------
function checkReminder(){
  if(!reminder.enabled) return;
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  const cur = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  const today = getLocalDateStr(now);
  if(cur === reminder.time && reminder.lastNotifiedDate !== today){
    if(dayPercent(today) !== 100){
      try{ new Notification('Zincirini kırma!', { body: 'Bugünü henüz işaretlemedin.' }); }catch(e){}
    }
    reminder.lastNotifiedDate = today;
    saveReminder();
  }
}
setInterval(checkReminder, 20000);
